name: Windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:titlebar
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: deepseek-harness-desktop-windows
          path: release/*.exe
