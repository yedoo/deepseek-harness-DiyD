name: Windows

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:titlebar
      - run: npm run dist:win
      - run: npm run test:packaged-native
      - uses: actions/upload-artifact@v7
        with:
          name: deepseek-harness-desktop-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
